<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MathIA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

    <!-- ===================================== -->
    <!-- SIDEBAR -->
    <!-- ===================================== -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                ∑
            </div>

            <div>
                <h2>MathIA</h2>
                <p>Asistente matemático inteligente</p>
            </div>

        </div>

        <div class="estado">

            <span class="punto"></span>

            activo

        </div>

        <div class="seccion">

            <h3>TEMAS</h3>

            <div class="tema">📈 Cálculo diferencial</div>

            <div class="tema">🧮 Álgebra lineal</div>

            <div class="tema">📊 Estadística</div>

            <div class="tema">📐 Geometría</div>

        </div>

        <div class="seccion">

            <h3>SESIÓN ACTUAL</h3>

            <div class="stats">

                <div class="card">

                    <h2 id="contadorPreguntas">0</h2>

                    <p>preguntas</p>

                </div>

                <div class="card">

                    <h2>100%</h2>

                    <p>activo</p>

                </div>

            </div>

        </div>

        <div class="seccion">

            <h3>ACCESO RÁPIDO</h3>

            <button class="side-btn">
                Fórmula general
            </button>

            <button class="side-btn">
                Integrales
            </button>

            <button class="side-btn">
                Derivadas
            </button>

        </div>

    </aside>

    <!-- ===================================== -->
    <!-- CHAT -->
    <!-- ===================================== -->

    <main class="chat-container">

        <div id="chat" class="chat">

            <div class="mensaje ia">

                👋 Hola, soy MathIA.

                Puedo ayudarte con:
                álgebra, cálculo, derivadas,
                integrales, matrices,
                PDFs y gráficas.

            </div>

        </div>

        <!-- ===================================== -->
        <!-- INPUT -->
        <!-- ===================================== -->

        <div class="input-area">

            <input
                type="file"
                id="pdfInput"
                accept=".pdf"
                hidden
            >

            <button
                class="icon-btn"
                onclick="document.getElementById('pdfInput').click()"
            >
                📄
            </button>

            <button
                class="icon-btn"
                onclick="subirPDF()"
            >
                ⬆
            </button>

            <textarea
                id="pregunta"
                placeholder="Escribe una pregunta matemática..."
            ></textarea>

            <button
                class="icon-btn"
                onclick="escucharVoz()"
            >
                🎤
            </button>

            <button
                class="enviar-btn"
                onclick="enviarPregunta()"
            >
                Enviar
            </button>

        </div>

    </main>

</div>

<script>

let totalPreguntas = 0

// =====================================
// SUBIR PDF
// =====================================

async function subirPDF() {

    const input = document.getElementById("pdfInput")

    const archivo = input.files[0]

    if (!archivo) {

        alert("Selecciona un PDF")

        return
    }

    const formData = new FormData()

    formData.append("pdf", archivo)

    try {

        const respuesta = await fetch("/subir_pdf", {

            method: "POST",

            body: formData

        })

        const datos = await respuesta.json()

        agregarMensajeIA(datos.mensaje)

    } catch(error) {

        agregarMensajeIA("Error al subir PDF")
    }
}

// =====================================
// MENSAJES
// =====================================

function agregarMensajeUsuario(texto) {

    const chat = document.getElementById("chat")

    chat.innerHTML += `

        <div class="mensaje usuario">

            ${texto}

        </div>

    `

    chat.scrollTop = chat.scrollHeight
}

function agregarMensajeIA(texto) {

    const chat = document.getElementById("chat")

    chat.innerHTML += `

        <div class="mensaje ia">

            ${texto}

        </div>

    `

    chat.scrollTop = chat.scrollHeight
}

// =====================================
// PREGUNTAR
// =====================================

async function enviarPregunta() {

    const pregunta = document.getElementById("pregunta").value

    if (!pregunta.trim()) return

    agregarMensajeUsuario(pregunta)

    document.getElementById("pregunta").value = ""

    totalPreguntas++

    document.getElementById(
        "contadorPreguntas"
    ).innerText = totalPreguntas

    try {

        const respuesta = await fetch("/preguntar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                pregunta: pregunta
            })
        })

        const datos = await respuesta.json()

        agregarMensajeIA(datos.respuesta)

        // =========================
        // VOZ
        // =========================

        const voz = new SpeechSynthesisUtterance(
            datos.respuesta
        )

        voz.lang = "es-ES"

        speechSynthesis.speak(voz)

        // =========================
        // GRÁFICAS
        // =========================

        if (datos.grafica) {

            const chat = document.getElementById("chat")

            chat.innerHTML += `

                <div class="mensaje ia">

                    <img
                        src="data:image/png;base64,${datos.grafica}"
                        class="grafica"
                    >

                </div>

            `
        }

    } catch(error) {

        agregarMensajeIA("Error de conexión")
    }
}

// =====================================
// VOZ
// =====================================

function escucharVoz() {

    const reconocimiento =
        new webkitSpeechRecognition()

    reconocimiento.lang = "es-ES"

    reconocimiento.start()

    reconocimiento.onresult = async function(evento) {

        const texto =
            evento.results[0][0].transcript

        document.getElementById(
            "pregunta"
        ).value = texto

        await enviarPregunta()
    }
}

</script>

</body>
</html>
