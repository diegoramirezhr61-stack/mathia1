<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathIA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="fondo"></div>

    <div class="contenedor">

        <h1>MathIA</h1>

        <p class="subtitulo">
            Inteligencia Artificial Matemática
        </p>
        <input
    type="file"
    id="pdfInput"
    accept=".pdf"
>

<button onclick="subirPDF()">
    Subir PDF
</button>

                <textarea
            id="pregunta"
            placeholder="Escribe un problema matemático..."
        ></textarea>

        <button onclick="enviarPregunta()">
            Preguntar
        </button>
        <button onclick="escucharVoz()">
    🎤 Hablar
</button>

        <div id="loader" class="loader oculto"></div>

        <div id="chat"></div>

    </div>

    <script>

    // =====================================
    // SUBIR PDF
    // =====================================

    async function subirPDF() {

        const input = document.getElementById("pdfInput")

        const archivo = input.files[0]

        if (!archivo) {

            alert("Selecciona un PDF")

            return
        }

        const formData = new FormData()

        formData.append("pdf", archivo)

        try {

            const respuesta = await fetch("/subir_pdf", {

                method: "POST",

                body: formData

            })

            const datos = await respuesta.json()

            alert(datos.mensaje)

        } catch(error) {

            alert("Error al subir PDF")
        }
    }

    // =====================================
    // PREGUNTAR IA
    // =====================================

    async function enviarPregunta() {

        let pregunta = document.getElementById("pregunta").value

        let respuestaDiv = document.getElementById("respuesta")

        let loader = document.getElementById("loader")

        let chat = document.getElementById("chat")


        loader.classList.remove("oculto")

        chat.innerHTML += `

    <div class="mensaje usuario">

        ${pregunta}

    </div>

`

        try {

            const respuesta = await fetch("/preguntar", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    pregunta: pregunta
                })
            })

            const datos = await respuesta.json()
            chat.innerHTML += `

    <div class="mensaje ia">

        ${datos.respuesta}

    </div>

`

            loader.classList.add("oculto")

            const voz = new SpeechSynthesisUtterance(datos.respuesta)

voz.lang = "es-ES"

speechSynthesis.speak(voz)

            // =========================
            // MOSTRAR GRÁFICA
            // =========================

if (datos.grafica) {

    chat.innerHTML += `

        <div class="mensaje ia">

            <img
                src="data:image/png;base64,${datos.grafica}"
                style="
                    width:100%;
                    border-radius:20px;
                    margin-top:10px;
                "
            >

        </div>

    `
}

chat.scrollTop = chat.scrollHeight
        } catch(error) {

            loader.classList.add("oculto")

            respuestaDiv.innerHTML = "Error de conexión"
        }
    }
    
 // =====================================
// VOZ
// =====================================

function escucharVoz() {

    const reconocimiento = new webkitSpeechRecognition()

    reconocimiento.lang = "es-ES"

    reconocimiento.start()

    reconocimiento.onresult = async function(evento) {

        const texto = evento.results[0][0].transcript

        document.getElementById("pregunta").value = texto

        await enviarPregunta()
    }
}
</script>
</body>
</html>
