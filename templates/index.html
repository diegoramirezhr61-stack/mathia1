<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathIA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="fondo"></div>

    <div class="conten<!DOCTYPE html>edor">

        <h1>MathIA</h1>

        <p class="subtitulo">
            Inteligencia Artificial Matemática
        </p>

                <textarea
            id="pregunta"
            placeholder="Escribe un problema matemático..."
        ></textarea>

        <button onclick="enviarPregunta()">
            Preguntar
        </button>

        <div id="loader" class="loader oculto"></div>

        <div id="respuesta"></div>

    </div>

    <script>

        async function enviarPregunta() {

            let pregunta = document.getElementById("pregunta").value;

            let respuestaDiv = document.getElementById("respuesta");

            let loader = document.getElementById("loader");

            respuestaDiv.innerHTML = "";

            loader.classList.remove("oculto");

            try {

                const respuesta = await fetch("/preguntar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        pregunta: pregunta
                    })
                });

                const datos = await respuesta.json();

                loader.classList.add("oculto");

respuestaDiv.innerHTML = datos.respuesta;

if (datos.grafica) {

    respuestaDiv.innerHTML += `

        <br><br>

        <img
            src="data:image/png;base64,${datos.grafica}"
            style="
                width:100%;
                border-radius:20px;
                margin-top:20px;
            "
        >
    `;
}

            } catch(error) {

                loader.classList.add("oculto");

                respuestaDiv.innerHTML = "Error de conexión";
            }
        }

    </script>


</body>
</html>
