<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathIA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="logo">
        <div class="logo-icon">∑</div>
        <div>
            <h2>MathIA</h2>
            <p>Asistente matemático inteligente</p>
        </div>
    </div>

    <div class="estado">
        <span class="punto"></span>
        activo
    </div>

    <div class="seccion">
        <h3>TEMAS</h3>
        <div class="tema">📈 Cálculo diferencial</div>
        <div class="tema">🧮 Álgebra lineal</div>
        <div class="tema">📊 Estadística</div>
        <div class="tema">📐 Geometría</div>
    </div>

    <div class="seccion">
        <h3>SESIÓN</h3>
        <div class="stats">
            <div class="card">
                <h2 id="contadorPreguntas">0</h2>
                <p>preguntas</p>
            </div>
            <div class="card">
                <h2>100%</h2>
                <p>activo</p>
            </div>
        </div>
    </div>

</aside>

<!-- CHAT -->
<main class="chat-container">

    <div id="chat" class="chat">

        <div class="mensaje ia">
            👋 Hola, soy MathIA. Puedo ayudarte con cálculo, álgebra, matrices, PDFs y más.
        </div>

    </div>

    <!-- INPUT -->
    <div class="input-area">

        <input type="file" id="pdfInput" accept=".pdf" hidden>

        <button class="icon-btn" onclick="document.getElementById('pdfInput').click()">📄</button>

        <button class="icon-btn" onclick="subirPDF()">⬆</button>

        <textarea id="pregunta" placeholder="Escribe una pregunta matemática..."></textarea>

        <button class="icon-btn" onclick="escucharVoz()">🎤</button>

        <button class="enviar-btn" onclick="enviarPregunta()">Enviar</button>

    </div>

</main>

</div>

<script>

let totalPreguntas = 0;

// ===============================
// UTILIDAD CHAT (MEJORADO)
// ===============================
function agregarMensaje(texto, tipo="ia") {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = `mensaje ${tipo}`;
    div.textContent = texto;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

// ===============================
// PDF UPLOAD (CORREGIDO)
// ===============================
async function subirPDF() {

    const input = document.getElementById("pdfInput");
    const archivo = input.files[0];

    if (!archivo) {
        alert("Selecciona un PDF");
        return;
    }

    // VALIDACIÓN
    if (archivo.size < 1000) {
        alert("PDF demasiado pequeño o vacío");
        return;
    }

    agregarMensaje("📄 Procesando PDF...", "ia");

    const formData = new FormData();
    formData.append("pdf", archivo);

    try {

        const respuesta = await fetch("/subir_pdf", {
            method: "POST",
            body: formData
        });

        const datos = await respuesta.json();

        console.log("PDF backend:", datos);

        agregarMensaje(datos.mensaje || "PDF procesado", "ia");

    } catch (error) {
        agregarMensaje("❌ Error al subir PDF", "ia");
    }

    // LIMPIAR INPUT (IMPORTANTE)
    input.value = "";
}

// ===============================
// ENVIAR PREGUNTA
// ===============================
async function enviarPregunta() {

    const input = document.getElementById("pregunta");
    const pregunta = input.value.trim();

    if (!pregunta) return;

    agregarMensaje(pregunta, "usuario");

    input.value = "";

    totalPreguntas++;
    document.getElementById("contadorPreguntas").innerText = totalPreguntas;

    agregarMensaje("🧠 Pensando...", "ia");

    try {

        const respuesta = await fetch("/preguntar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ pregunta })
        });

        const datos = await respuesta.json();

        agregarMensaje(datos.respuesta, "ia");

        // VOZ (CORREGIDO)
        const voz = new SpeechSynthesisUtterance(datos.respuesta);
        voz.lang = "es-ES";

        speechSynthesis.cancel();
        speechSynthesis.speak(voz);

        // GRÁFICA
        if (datos.grafica) {

            const chat = document.getElementById("chat");

            const img = document.createElement("img");
            img.src = "data:image/png;base64," + datos.grafica;
            img.className = "grafica";

            const div = document.createElement("div");
            div.className = "mensaje ia";
            div.appendChild(img);

            chat.appendChild(div);

        }

    } catch (error) {
        agregarMensaje("❌ Error de conexión con el servidor", "ia");
    }
}

// ===============================
// VOZ
// ===============================
function escucharVoz() {

    const reconocimiento = new webkitSpeechRecognition();

    reconocimiento.lang = "es-ES";
    reconocimiento.start();

    reconocimiento.onresult = async function(evento) {

        const texto = evento.results[0][0].transcript;

        document.getElementById("pregunta").value = texto;

        await enviarPregunta();
    };
}

</script>

</body>
</html>
