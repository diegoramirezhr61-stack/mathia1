<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MathIA</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<!-- MATHJAX -->

    tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
    },
    svg: {
        fontCache: 'global'
    }
};
</script>

<script
id="MathJax-script"
async
src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>

</head>

<body>

<!-- MENU MOBILE -->
<button class="menu-btn" onclick="toggleSidebar()">
☰
</button>

<div class="app">

<!-- =========================
SIDEBAR
========================= -->

<aside class="sidebar" id="sidebar">

    <div class="logo">

        <div class="logo-icon">
            ∑
        </div>

        <div>
            <h2>MathIA</h2>
            <p>Asistente matemático inteligente</p>
        </div>

    </div>

    <div class="estado">
        <span class="punto"></span>
        Sistema activo
    </div>

    <!-- TEMAS -->

    <div class="seccion">

        <h3>TEMAS</h3>

        <div class="tema">
            📈 Cálculo diferencial
        </div>

        <div class="tema">
            🧮 Álgebra lineal
        </div>

        <div class="tema">
            📊 Estadística
        </div>

        <div class="tema">
            📐 Geometría
        </div>

    </div>

    <!-- STATS -->

    <div class="seccion">

        <h3>SESIÓN</h3>

        <div class="stats">

            <div class="card">
                <h2 id="contadorPreguntas">0</h2>
                <p>Preguntas</p>
            </div>

            <div class="card">
                <h2 id="contadorGraficas">0</h2>
                <p>Gráficas</p>
            </div>

        </div>

    </div>

</aside>

<!-- =========================
CHAT
========================= -->

<main class="chat-container">

    <!-- CHAT -->

    <div id="chat" class="chat">

        <div class="mensaje ia">
            👋 Hola, soy MathIA.
            Puedo ayudarte con cálculo,
            álgebra, matrices, PDFs,
            gráficas matemáticas y fotos
            de ejercicios.
        </div>

    </div>

    <!-- INPUT -->

    <div class="input-area">

        <!-- FOTO -->

        <input
        type="file"
        id="imagenInput"
        accept="image/*"
        hidden>

        <script>

document.getElementById("imagenInput")
.addEventListener("change", subirImagen);

</script>

        <input
type="file"
id="imagenInput"
accept="image/*"
hidden
onchange="analizarImagen()"
>

<button
class="icon-btn"
onclick="document.getElementById('imagenInput').click()">
📷
</button>

        <!-- PDF -->

        <input
        type="file"
        id="pdfInput"
        accept=".pdf"
        hidden>

        <button class="icon-btn"
        onclick="document.getElementById('pdfInput').click()">
        📄
        </button>

        <button class="icon-btn"
        onclick="subirPDF()">
        ⬆
        </button>

        <!-- INPUT -->

        <textarea
        id="pregunta"
        placeholder="Escribe una pregunta matemática...">
        </textarea>

        <!-- MICRO -->

        <button class="icon-btn"
        onclick="escucharVoz()">
        🎤
        </button>

        <!-- ENVIAR -->

        <button class="enviar-btn"
        onclick="enviarPregunta()">
        Enviar
        </button>

    </div>

</main>

</div>

<script>

let usarVoz = false;
let totalPreguntas = 0;
let totalGraficas = 0;

// =========================
// MENSAJES
// =========================

function agregarMensaje(texto, tipo="ia") {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = `mensaje ${tipo}`;

    div.innerHTML = texto.replace(/\n/g, "<br>");

    chat.appendChild(div);

    // MATHJAX

    if (window.MathJax) {
        MathJax.typesetPromise([div]);
    }

    chat.scrollTop = chat.scrollHeight;
}

// =========================
// TYPING
// =========================

function agregarTyping() {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = "mensaje ia typing";

    div.id = "typing";

    div.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
    `;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

function quitarTyping() {

    const typing = document.getElementById("typing");

    if (typing) {
        typing.remove();
    }
}

// =========================
// SONIDO
// =========================

function sonar() {

    const audio = new Audio(
        "https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"
    );

    audio.volume = 0.2;

    audio.play();
}

// =========================
// PDF
// =========================

async function subirPDF() {

    const input = document.getElementById("pdfInput");

    const archivo = input.files[0];

    if (!archivo) {
        alert("Selecciona un PDF");
        return;
    }

    agregarMensaje("📄 Procesando PDF...", "ia");

    const formData = new FormData();

    formData.append("pdf", archivo);

    try {

        const respuesta = await fetch("/subir_pdf", {
            method: "POST",
            body: formData
        });

        const datos = await respuesta.json();

        agregarMensaje(datos.mensaje, "ia");

    } catch {

        agregarMensaje(
            "❌ Error al subir PDF",
            "ia"
        );
    }

    input.value = "";
}

// ========================================
// SUBIR IMAGEN
// ========================================

async function subirImagen() {

    const input = document.getElementById("imagenInput");

    const imagen = input.files[0];

    if (!imagen) return;

    agregarMensaje(
        "📷 Analizando imagen matemática...",
        "ia"
    );

    const formData = new FormData();

    formData.append("imagen", imagen);

    try {

        const respuesta = await fetch(
            "/resolver_imagen",
            {
                method: "POST",
                body: formData
            }
        );

        const datos = await respuesta.json();

        if(datos.texto_detectado){

            agregarMensaje(
                "📸 Texto detectado:<br><br>" +
                datos.texto_detectado,
                "ia"
            );
        }

        agregarMensaje(
            datos.respuesta,
            "ia"
        );

    } catch(error){

        agregarMensaje(
            "❌ Error procesando imagen",
            "ia"
        );
    }

    input.value = "";
}
// =========================
// OCR FOTO
// =========================

document.getElementById("imagenInput")
.addEventListener("change", async function() {

    const archivo = this.files[0];

    if (!archivo) return;

    agregarMensaje(
        "📷 Analizando imagen matemática...",
        "ia"
    );

    agregarTyping();

    const formData = new FormData();

    formData.append("imagen", archivo);

    try {

        const respuesta = await fetch(
            "/resolver_imagen",
            {
                method: "POST",
                body: formData
            }
        );

        const datos = await respuesta.json();

        quitarTyping();

        agregarMensaje(
            "📸 Texto detectado:<br><br>" +
            datos.texto_detectado,
            "ia"
        );

        agregarMensaje(
            datos.respuesta,
            "ia"
        );

    } catch {

        quitarTyping();

        agregarMensaje(
            "❌ Error leyendo imagen",
            "ia"
        );
    }

});

async function analizarImagen() {

    const input = document.getElementById("imagenInput");

    const archivo = input.files[0];

    if (!archivo) {
        alert("Selecciona una imagen");
        return;
    }

    agregarMensaje(
        "📷 Analizando imagen matemática...",
        "ia"
    );

    const formData = new FormData();

    formData.append("imagen", archivo);

    try {

        const respuesta = await fetch(
            "/resolver_imagen",
            {
                method: "POST",
                body: formData
            }
        );

        const datos = await respuesta.json();

        agregarMensaje(
            "📸 Texto detectado:\n\n" +
            datos.texto_detectado,
            "ia"
        );

        agregarMensaje(
            datos.respuesta,
            "ia"
        );

    } catch(error){

        agregarMensaje(
            "❌ Error leyendo imagen",
            "ia"
        );
    }

    input.value = "";
}

// =========================
// ENVIAR
// =========================

async function enviarPregunta() {

    const input = document.getElementById("pregunta");

    const pregunta = input.value.trim();

    if (!pregunta) return;

    agregarMensaje(pregunta, "usuario");

    input.value = "";

    totalPreguntas++;

    document.getElementById(
        "contadorPreguntas"
    ).innerText = totalPreguntas;

    agregarTyping();

    try {

        const respuesta = await fetch("/preguntar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                pregunta: pregunta
            })
        });

        const datos = await respuesta.json();

        quitarTyping();

        agregarMensaje(datos.respuesta, "ia");

        sonar();

        // VOZ

        if (usarVoz) {

            const voz = new SpeechSynthesisUtterance(
                datos.respuesta
            );

            voz.lang = "es-ES";

            speechSynthesis.cancel();

            speechSynthesis.speak(voz);
        }

        // GRAFICA

        if (datos.grafica) {

            totalGraficas++;

            document.getElementById(
                "contadorGraficas"
            ).innerText = totalGraficas;

            const div = document.createElement("div");

            div.className = "mensaje ia";

            div.innerHTML = `
                <img class="grafica"
                src="data:image/png;base64,${datos.grafica}">
            `;

            document.getElementById("chat")
                .appendChild(div);

            document.getElementById("chat")
                .scrollTop =
                document.getElementById("chat").scrollHeight;
        }

    } catch {

        quitarTyping();

        agregarMensaje(
            "❌ Error conectando con el servidor",
            "ia"
        );
    }
}


// =========================
// ENTER
// =========================

document.getElementById("pregunta")
.addEventListener("keypress", function(e){

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();

        enviarPregunta();
    }
});

// =========================
// VOZ
// =========================

function escucharVoz() {

    usarVoz = true;

    const reconocimiento = new webkitSpeechRecognition();

    reconocimiento.lang = "es-ES";

    reconocimiento.start();

    reconocimiento.onresult = async function(evento){

        const texto =
        evento.results[0][0].transcript;

        document.getElementById("pregunta")
        .value = texto;

        await enviarPregunta();

        usarVoz = false;
    };
}

// =========================
// SIDEBAR MOBILE
// =========================

function toggleSidebar(){

    const sidebar =
    document.getElementById("sidebar");

    sidebar.classList.toggle(
        "sidebar-activo"
    );
}

</script>

</body>
</html>
