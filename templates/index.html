<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathIA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="logo">
        <div class="logo-icon">∑</div>
        <div>
            <h2>MathIA</h2>
            <p>Asistente matemático inteligente</p>
        </div>
    </div>

    <div class="estado">
        <span class="punto"></span>
        activo
    </div>

    <div class="seccion">
        <h3>TEMAS</h3>
        <div class="tema">📈 Cálculo diferencial</div>
        <div class="tema">🧮 Álgebra lineal</div>
        <div class="tema">📊 Estadística</div>
        <div class="tema">📐 Geometría</div>
    </div>

    <div class="seccion">
        <h3>SESIÓN</h3>
        <div class="stats">
            <div class="card">
                <h2 id="contadorPreguntas">0</h2>
                <p>preguntas</p>
            </div>
            <div class="card">
                <h2>100%</h2>
                <p>activo</p>
            </div>
        </div>
    </div>

    <!-- 🔥 PANEL MATEMÁTICO NUEVO -->
    <div class="seccion">

        <h3>PANEL MATEMÁTICO</h3>

        <div class="stats">

            <div class="card">
                <h2 id="contadorPreguntas">0</h2>
                <p>preguntas</p>
            </div>

            <div class="card">
                <h2 id="totalGraficas">0</h2>
                <p>gráficas</p>
            </div>

        </div>

        <div class="seccion">

            <h3>HISTORIAL</h3>

            <div id="historial" style="
                max-height:200px;
                overflow-y:auto;
                font-size:13px;
                color:#cbd5e1;
                display:flex;
                flex-direction:column;
                gap:8px;
            "></div>

        </div>

    </div>

</aside>

<!-- CHAT -->
<main class="chat-container">

    <div id="chat" class="chat">

        <div class="mensaje ia">
            👋 Hola, soy MathIA. Puedo ayudarte con cálculo, álgebra, matrices, PDFs y más.
        </div>

    </div>

    <!-- INPUT -->
    <div class="input-area">

        <input type="file" id="pdfInput" accept=".pdf" hidden>

        <button class="icon-btn" onclick="document.getElementById('pdfInput').click()">📄</button>

        <button class="icon-btn" onclick="subirPDF()">⬆</button>

        <textarea id="pregunta" placeholder="Escribe una pregunta matemática..."></textarea>

        <button class="icon-btn" onclick="escucharVoz()">🎤</button>

        <button class="enviar-btn" onclick="enviarPregunta()">Enviar</button>

    </div>

</main>

</div>

<script>

let usarVoz = false;
let totalGraficas = 0;

// ===============================
// HISTORIAL
// ===============================
function agregarHistorial(texto){

    const historial = document.getElementById("historial");

    if (!historial) return;

    const item = document.createElement("div");
    item.textContent = "📌 " + texto;

    historial.prepend(item);

    if (historial.children.length > 10) {
        historial.removeChild(historial.lastChild);
    }
}

// ===============================
// TYPING
// ===============================
function agregarTyping(){
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "mensaje ia typing";
    div.id = "typing";
    div.textContent = "MathIA escribiendo";

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function quitarTyping(){
    const typing = document.getElementById("typing");
    if (typing) typing.remove();
}

// ===============================
// MENSAJES
// ===============================
function agregarMensaje(texto, tipo="ia") {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = `mensaje ${tipo}`;
    div.textContent = texto;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// ===============================
// PDF
// ===============================
async function subirPDF() {

    const input = document.getElementById("pdfInput");
    const archivo = input.files[0];

    if (!archivo) return;

    agregarMensaje("📄 Procesando PDF...", "ia");

    const formData = new FormData();
    formData.append("pdf", archivo);

    try {

        const respuesta = await fetch("/subir_pdf", {
            method: "POST",
            body: formData
        });

        const datos = await respuesta.json();

        agregarMensaje(datos.mensaje, "ia");

    } catch (error) {
        agregarMensaje("❌ Error al subir PDF", "ia");
    }

    input.value = "";
}

// ===============================
// ENVIAR PREGUNTA
// ===============================
async function enviarPregunta() {

    const input = document.getElementById("pregunta");
    const pregunta = input.value.trim();

    if (!pregunta) return;

    agregarMensaje(pregunta, "usuario");
    agregarHistorial("Tú: " + pregunta);

    input.value = "";

    totalPreguntas++;
    document.getElementById("contadorPreguntas").innerText = totalPreguntas;

    agregarTyping();

    try {

        const respuesta = await fetch("/preguntar", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ pregunta })
        });

        const datos = await respuesta.json();

        quitarTyping();

        agregarMensaje(datos.respuesta, "ia");
        agregarHistorial("IA: " + datos.respuesta.substring(0, 60) + "...");

        // VOZ SOLO SI USAS MICRÓFONO
        if (usarVoz) {

            const voz = new SpeechSynthesisUtterance(datos.respuesta);
            voz.lang = "es-ES";

            speechSynthesis.cancel();
            speechSynthesis.speak(voz);
        }

        // GRÁFICA
        if (datos.grafica) {

            totalGraficas++;
            document.getElementById("totalGraficas").innerText = totalGraficas;

            const chat = document.getElementById("chat");

            const div = document.createElement("div");
            div.className = "mensaje ia";

            const img = document.createElement("img");
            img.src = "data:image/png;base64," + datos.grafica;
            img.className = "grafica";

            div.appendChild(img);
            chat.appendChild(div);
        }

    } catch (error) {
        quitarTyping();
        agregarMensaje("❌ Error de conexión", "ia");
    }
}

// ===============================
// VOZ
// ===============================
function escucharVoz() {

    usarVoz = true;

    const reconocimiento = new webkitSpeechRecognition();
    reconocimiento.lang = "es-ES";
    reconocimiento.start();

    reconocimiento.onresult = async function(evento) {

        const texto = evento.results[0][0].transcript;

        document.getElementById("pregunta").value = texto;

        await enviarPregunta();

        usarVoz = false;
    }
}

</script>

</body>
</html>
