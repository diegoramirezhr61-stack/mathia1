<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MathIA</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<!-- MATHJAX -->

<script>
window.MathJax = {
    tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
    },
    svg: {
        fontCache: 'global'
    }
};
</script>

<script
id="MathJax-script"
async
src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>

</head>

<body>

<!-- MENU MOBILE -->

<button class="menu-btn" onclick="toggleSidebar()">
☰
</button>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="logo">

        <div class="logo-icon">
            ∑
        </div>

        <div>
            <h2>MathIA</h2>
            <p>Asistente matemático inteligente</p>
        </div>

    </div>

    <div class="estado">
        <span class="punto"></span>
        Sistema activo
    </div>

    <!-- TEMAS -->

    <div class="seccion">

        <h3>TEMAS</h3>

        <div class="tema">
            📈 Cálculo diferencial
        </div>

        <div class="tema">
            🧮 Álgebra lineal
        </div>

        <div class="tema">
            📊 Estadística
        </div>

        <div class="tema">
            📐 Geometría
        </div>

    </div>

    <!-- STATS -->

    <div class="seccion">

        <h3>SESIÓN</h3>

        <div class="stats">

            <div class="card">
                <h2 id="contadorPreguntas">0</h2>
                <p>Preguntas</p>
            </div>

            <div class="card">
                <h2 id="contadorGraficas">0</h2>
                <p>Gráficas</p>
            </div>

        </div>

    </div>

</aside>

<!-- CHAT -->

<main class="chat-container">

    <div id="chat" class="chat">

        <div class="mensaje ia">
            👋 Hola, soy MathIA.<br><br>

            Puedo ayudarte con:
            <br><br>

            • cálculo<br>
            • álgebra<br>
            • matrices<br>
            • derivadas<br>
            • integrales<br>
            • gráficas matemáticas
        </div>

    </div>

    <!-- INPUT -->

    <div class="input-area">

        <!-- INPUT TEXTO -->

        <textarea
        id="pregunta"
        placeholder="Escribe una pregunta matemática...">
        </textarea>

        <!-- MICRO -->

        <button
        class="icon-btn"
        onclick="escucharVoz()">
        🎤
        </button>

        <!-- ENVIAR -->

        <button
        class="enviar-btn"
        onclick="enviarPregunta()">
        Enviar
        </button>
        

    </div>

</main>

</div>

<script>

let usarVoz = false;

let totalPreguntas = 0;

let totalGraficas = 0;


// =========================
// MENSAJES
// =========================

function agregarMensaje(texto, tipo="ia") {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = `mensaje ${tipo}`;

    div.innerHTML = texto.replace(/\n/g, "<br>");

    chat.appendChild(div);

    // MATHJAX

    if (window.MathJax) {
        MathJax.typesetPromise([div]);
    }

    chat.scrollTop = chat.scrollHeight;
}

// =========================
// TYPING
// =========================

function agregarTyping() {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = "mensaje ia typing";

    div.id = "typing";

    div.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
    `;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

function quitarTyping() {

    const typing = document.getElementById("typing");

    if (typing) {
        typing.remove();
    }
}

// =========================
// SONIDO
// =========================

function sonar() {

    const audio = new Audio(
        "https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"
    );

    audio.volume = 0.2;

    audio.play();
}

// =========================
// ENVIAR PREGUNTA
// =========================

async function enviarPregunta() {

    const input = document.getElementById("pregunta");

    const pregunta = input.value.trim();

    if (!pregunta) return;

    agregarMensaje(pregunta, "usuario");

    input.value = "";

    totalPreguntas++;

    document.getElementById(
        "contadorPreguntas"
    ).innerText = totalPreguntas;

    agregarTyping();

    try {

        const respuesta = await fetch("/preguntar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                pregunta: pregunta
            })
        });

        const datos = await respuesta.json();

        quitarTyping();

        agregarMensaje(datos.respuesta, "ia");

        sonar();

        // VOZ

        if (usarVoz) {

    speechSynthesis.cancel();

    const voz =
    new SpeechSynthesisUtterance(
        datos.respuesta
    );

    voz.lang = "es-ES";

    voz.rate = 1;

    voz.pitch = 1;

    speechSynthesis.speak(voz);
}

        // GRAFICA

        if (datos.grafica) {

            totalGraficas++;

            document.getElementById(
                "contadorGraficas"
            ).innerText = totalGraficas;

            const div = document.createElement("div");

            div.className = "mensaje ia";

            div.innerHTML = `
                <img class="grafica"
                src="data:image/png;base64,${datos.grafica}">
            `;

            document.getElementById("chat")
                .appendChild(div);

            document.getElementById("chat")
                .scrollTop =
                document.getElementById("chat").scrollHeight;
        }

    } catch {

        quitarTyping();

        agregarMensaje(
            "❌ Error conectando con el servidor",
            "ia"
        );
    }
}

// =========================
// ENTER
// =========================

document.getElementById("pregunta")
.addEventListener("keypress", function(e){

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();

        enviarPregunta();
    }
});

// =========================
// VOZ
// =========================

let escuchando = false;

let reconocimiento = null;

// =========================
// VOZ INTELIGENTE
// =========================

function escucharVoz() {

    const boton =
    document.querySelector(".icon-btn");

    // =====================
    // SI ESTÁ HABLANDO
    // =====================

    if (speechSynthesis.speaking) {

        speechSynthesis.cancel();

        boton.style.background = "#1e293b";

        return;
    }

    // =====================
    // SI YA ESCUCHA
    // =====================

    if (escuchando && reconocimiento) {

        reconocimiento.stop();

        escuchando = false;

        boton.style.background = "#1e293b";

        return;
    }

    // =====================
    // ACTIVAR MICRO
    // =====================

    usarVoz = true;

    reconocimiento =
    new webkitSpeechRecognition();

    reconocimiento.lang = "es-ES";

    reconocimiento.start();

    escuchando = true;

    // EFECTO VISUAL

    boton.style.background = "#ef4444";

    boton.style.boxShadow =
    "0 0 20px rgba(239,68,68,.7)";

    // =====================
    // RESULTADO
    // =====================

    reconocimiento.onresult =
    async function(evento){

        const texto =
        evento.results[0][0].transcript;

        document.getElementById(
            "pregunta"
        ).value = texto;

        await enviarPregunta();

        escuchando = false;

        usarVoz = false;

        boton.style.background = "#1e293b";

        boton.style.boxShadow = "none";
    };

    // =====================
    // ERROR
    // =====================

    reconocimiento.onerror = function(){

        escuchando = false;

        boton.style.background = "#1e293b";

        boton.style.boxShadow = "none";
    };

    // =====================
    // FIN
    // =====================

    reconocimiento.onend = function(){

        escuchando = false;

        boton.style.background = "#1e293b";

        boton.style.boxShadow = "none";
    };
}

// =========================
// SIDEBAR MOBILE
// =========================

function toggleSidebar(){

    const sidebar =
    document.getElementById("sidebar");

    sidebar.classList.toggle(
        "sidebar-activo"
    );
}

</script>

</body>
</html>
